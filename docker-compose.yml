# V-FLO 智能办公系统 · 单服务器 Docker Compose（无 K8s）
# 硬件参考：海光 32C/64T / 256GB / NVMe（公司服务器 192.168.2.22）
# 资源配额依据《V-FLO智能办公系统部署方案（单服务器版）》写死，预留系统与缓存余量。
# 用法：
#   cp .env.deploy.example .env   # 填写密钥
#   docker compose up -d
#   curl http://127.0.0.1:8000/api/health
#
# 说明：deploy.resources.limits 在 Docker Compose V2（docker compose up）下生效；
#       如使用旧版 docker-compose v1，请改用 mem_limit / cpus（见文末注释）。

x-db-common: &db_common
  restart: unless-stopped

services:
  db:
    <<: *db_common
    image: postgres:16-alpine
    container_name: vflo-pg
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vflo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-strong}
      POSTGRES_DB: ${POSTGRES_DB:-vflo_office}
    volumes:
      # 生产：指向数据盘 RAID 卷，例如 /data/pg
      - ${PG_DATA:-./data/pg}:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vflo}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # 方案配额：4–6 核 / 32–48GB → 取 6C / 40GB
    deploy:
      resources:
        limits:
          cpus: "6.0"
          memory: 40g
        reservations:
          cpus: "2.0"
          memory: 8g

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vflo-app
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-vflo}:${POSTGRES_PASSWORD:-change-me-strong}@db:5432/${POSTGRES_DB:-vflo_office}
      SECRET_KEY: ${SECRET_KEY:-please-change-me}
      MIMO_API_KEY: ${MIMO_API_KEY:-}
      MIMO_BASE_URL: ${MIMO_BASE_URL:-https://api.mimo.com/v1}
      MIMO_MODEL: ${MIMO_MODEL:-mimo-v2.6}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      KIMI_API_KEY: ${KIMI_API_KEY:-}
      KIMI_BASE_URL: ${KIMI_BASE_URL:-https://api.moonshot.cn/v1}
      KIMI_MODEL: ${KIMI_MODEL:-moonshot-v1-128k}
      JDY_APP_ID: ${JDY_APP_ID:-}
      JDY_API_KEY: ${JDY_API_KEY:-}
      JDY_ENTRY_TASK: ${JDY_ENTRY_TASK:-}
      JDY_ENTRY_KNOWLEDGE: ${JDY_ENTRY_KNOWLEDGE:-}
      ENABLE_DEV_LOGIN: ${ENABLE_DEV_LOGIN:-1}
      MOCK_LLM: ${MOCK_LLM:-auto}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-20}
      DB_POOL_RECYCLE: ${DB_POOL_RECYCLE:-1800}
    volumes:
      - ${APP_LOGS:-./data/logs}:/app/logs
      - ${APP_UPLOADS:-./data/uploads}:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    command: >
      sh -c "uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers ${UVICORN_WORKERS:-4}"
    # 方案配额：8–12 核 / 16–24GB → 取 12C / 20GB
    deploy:
      resources:
        limits:
          cpus: "12.0"
          memory: 20g
        reservations:
          cpus: "2.0"
          memory: 4g

  nginx:
    image: nginx:alpine
    container_name: vflo-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web:/usr/share/nginx/html:ro
      - ${NGINX_CERTS:-./deploy/certs}:/etc/nginx/certs:ro
    depends_on:
      - app
    # 方案配额：1–2 核 / 2–4GB → 取 2C / 3GB
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 3g
        reservations:
          cpus: "0.5"
          memory: 512m

  redis:
    image: redis:7-alpine
    container_name: vflo-redis
    restart: unless-stopped
    profiles: ["cache"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - ${REDIS_DATA:-./data/redis}:/data
    # 方案配额：1–2 核 / 4–8GB → 取 2C / 6GB
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 6g
        reservations:
          cpus: "0.5"
          memory: 1g

  backup:
    image: postgres:16-alpine
    container_name: vflo-backup
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vflo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-strong}
      POSTGRES_DB: ${POSTGRES_DB:-vflo_office}
      BACKUP_DIR: /backups
      KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
    volumes:
      - ${BACKUP_DIR:-./data/backups}:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        echo "[backup] start $$(date -Iseconds)"
        while true; do
          F=/backups/vflo_$$(date +%Y%m%d_%H%M%S).sql.gz
          pg_dump -h db -U $$POSTGRES_USER $$POSTGRES_DB | gzip > $$F
          echo "[backup] wrote $$F"
          find /backups -name 'vflo_*.sql.gz' -mtime +$$KEEP_DAYS -delete
          sleep 86400
        done
    # 方案配额：备份/监控 2 核 / 8GB → 取 2C / 4GB（dump 为主，峰值短暂）
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4g
        reservations:
          cpus: "0.5"
          memory: 512m

# 总配额合计：24C / 73GB（上限），相对 32C/256GB 预留约 8C 与 180GB 供系统与页缓存。
#
# —— 若使用 docker-compose v1（不识别 deploy.resources），请改为在各服务下增加：——
#   mem_limit: 40g
#   cpus: 6.0
#   mem_reservation: 8g
# （按上表服务对应替换数值）
